# Every Monday: refresh the link-preview picture (img/og-image.png) so shared links show this week's answer and
# number. Commits only when the picture changed. Can also be run by hand from the Actions tab.
name: Weekly share picture
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  og-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run og-image
      - name: Commit the new picture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/og-image.png
          git diff --cached --quiet || (git commit -m "Weekly share picture" && git push)
